name = "statevera-desk"
main = "worker/index.ts"
compatibility_date = "2026-08-01"

# "Sign in with GitHub" on the desk. The client id of a GitHub App with the
# device flow enabled, installed on this repository only. It is public — the
# gate is that the API hands the token back for one account and no other.
# Leave it empty and the desk asks for a token instead.
[vars]
GITHUB_CLIENT_ID = "Iv23liciTh2wuL12SR1q"
# Who may sign in. The publication's account by default; add others with commas.
DESK_LOGINS = "zeynepdorukk"

# Read counts. One key per device per article; the country, referring host and
# date ride along as KV metadata, so a breakdown costs no extra reads.
[[kv_namespaces]]
binding = "VIEWS"
id = "691d4b0743b242b197ba9b78acff41a5"

# GOVINFO_API_KEY, CONGRESS_API_KEY and OSCE_SEARCH_API_KEY are optional: each
# adapter falls back to a public key. Add them with
#   npx wrangler secret put GOVINFO_API_KEY
# GITHUB_CLIENT_SECRET is only needed for an OAuth App; a GitHub App's device
# flow does not use one.

# Per-route rate limits, shared by every isolate in a Cloudflare location.
# Without these bindings the API falls back to an in-memory window per isolate.
# Period must be 10 or 60 seconds.
[[ratelimits]]
name = "LIMIT_SEARCH"
namespace_id = "4101"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "LIMIT_VIEWS"
namespace_id = "4102"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "LIMIT_AUTH"
namespace_id = "4103"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "LIMIT_SUBSCRIBE"
namespace_id = "4105"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "LIMIT_ASSISTANT"
namespace_id = "4104"
simple = { limit = 60, period = 60 }

# Structured request logs (one JSON line per request) in Workers Logs.
[observability]
enabled = true
head_sampling_rate = 1
