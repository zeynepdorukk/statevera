name: Refresh the wire

# The site is static, so the News feed is a snapshot. This job retakes it every
# fifteen minutes and commits changes, then dispatches the Pages deploy.
#
# A push made with GITHUB_TOKEN never fires other workflows' `push` triggers, so
# the commit alone does not redeploy the site. workflow_dispatch is the one event
# GITHUB_TOKEN is allowed to start, hence the explicit dispatch below.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: wire
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch the wire
        run: node scripts/fetch-wire.mjs

      - name: Fetch market snapshot
        run: node scripts/fetch-markets.mjs

      - name: Verify the snapshot
        run: node scripts/check-content.mjs

      - name: Commit if anything changed
        id: commit
        run: |
          if git diff --quiet -- src/data/wire.json src/data/markets.json; then
            echo "No new stories or market changes."
            exit 0
          fi
          git config user.name "statevera-wire[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          COUNT=$(node -e "console.log(require('./src/data/wire.json').items.length)")
          git add src/data/wire.json src/data/markets.json
          git commit -m "Wire: refresh snapshot (${COUNT} stories)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Redeploy the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
