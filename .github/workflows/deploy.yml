name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    concurrency:
      group: pages-build
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check content integrity
        run: node scripts/check-content.mjs
      - name: Build
        run: npm run build
        env:
          # Set this repository variable to the deployed Worker URL. Without it
          # the pages that need the API say so instead of calling nowhere.
          PUBLIC_DESK_URL: ${{ vars.PUBLIC_DESK_URL }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Once the new pages are live, ping IndexNow (Bing, Yandex, …) with the
  # Journal URLs this push published, edited or removed. Wire refreshes are
  # workflow_dispatch runs and are skipped. Never fails the deploy.
  indexnow:
    needs: deploy
    if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Submit changed Journal URLs
        run: node scripts/indexnow.mjs --submit $(git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- src/content/articles)
