name: Deploy the API Worker

# Ships worker/ and src/server/ to Cloudflare when they change on main.
#
# Needs one repository secret, CLOUDFLARE_API_TOKEN (a token with the
# "Edit Cloudflare Workers" template, scoped to the account that owns
# statevera-desk), and optionally CLOUDFLARE_ACCOUNT_ID. Without the token
# the job explains itself and exits cleanly instead of failing every push.

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "src/server/**"
      - "src/primary-sources/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Token present?
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping the Worker deploy. Run 'npm run api:deploy' locally instead."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.gate.outputs.ready == 'true'
      - name: Tests
        if: steps.gate.outputs.ready == 'true'
        run: npm test
      - name: Deploy
        if: steps.gate.outputs.ready == 'true'
        run: npx wrangler deploy --var RELEASE:${GITHUB_SHA::12}
      - name: Smoke test
        if: steps.gate.outputs.ready == 'true'
        run: |
          sleep 5
          curl -fsS "https://statevera-desk.onatozmen44.workers.dev/api/health" | tee /dev/stderr | grep -q '"ok":true'
